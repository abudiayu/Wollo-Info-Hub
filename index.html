<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png"
      href="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png"
    />
    <title>Nexeus — Build your future now</title>

    <!-- Fonts: Instrument Serif (display) + Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Entrance: add js-enter to <html> BEFORE first paint.
      If prefers-reduced-motion reduce → do NOT add it.
      If JS fails → do NOT add it (content stays fully visible).
    -->
    <script>
      (function () {
        try {
          if (
            window.matchMedia &&
            !matchMedia('(prefers-reduced-motion: reduce)').matches
          ) {
            document.documentElement.classList.add('js-enter');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
